name: SystemX PQC ASN.1 profile

on:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "asn1/systemx-pqc/**"
      - "vanetza/asn1/**"
      - "vanetza/security/v3/**"
      - "vanetza/security/tests/geometry.cpp"
      - ".github/workflows/systemx-pqc-asn1.yml"
  push:
    branches: [master]
    paths:
      - "CMakeLists.txt"
      - "asn1/systemx-pqc/**"
      - "vanetza/asn1/**"
      - "vanetza/security/v3/**"
      - "vanetza/security/tests/geometry.cpp"
      - ".github/workflows/systemx-pqc-asn1.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    name: build and test (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [standard, systemx-pqc]
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libboost-date-time-dev libboost-program-options-dev \
            libboost-system-dev libcrypto++-dev libgeographiclib-dev \
            libssl-dev

      - name: Configure
        run: |
          options=(
            -S .
            -B "build-${{ matrix.profile }}"
            -G Ninja
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_CXX_STANDARD=14
            -DCMAKE_CXX_STANDARD_REQUIRED=ON
            -DCMAKE_CXX_EXTENSIONS=OFF
            -DVANETZA_WITH_RPC=OFF
            -DBUILD_TESTS=ON
            -DBUILD_CERTIFY=ON
            -DBUILD_SOCKTAP=ON
          )
          if [[ "${{ matrix.profile }}" == "systemx-pqc" ]]; then
            options+=(-DVANETZA_WITH_PQC=ON)
          else
            options+=(-DVANETZA_WITH_PQC=OFF)
          fi
          cmake "${options[@]}"

      - name: Build
        run: cmake --build "build-${{ matrix.profile }}" --parallel 2

      - name: Test
        run: ctest --test-dir "build-${{ matrix.profile }}" --output-on-failure

      - name: Check installed ASN.1 profile
        run: |
          prefix="${RUNNER_TEMP}/install-${{ matrix.profile }}"
          cmake --install "build-${{ matrix.profile }}" --prefix "${prefix}"
          selector="${prefix}/include/vanetza/asn1/security_profile.hpp"
          standard_tbs="${prefix}/include/vanetza/asn1/security/ToBeSignedCertificate.h"
          pqc_tbs="${prefix}/include/vanetza/asn1/systemx-pqc/ToBeSignedCertificate.h"
          test -f "${selector}"
          if [[ "${{ matrix.profile }}" == "systemx-pqc" ]]; then
            test -f "${pqc_tbs}"
            test ! -e "${standard_tbs}"
            grep -q 'altVerificationKey' "${pqc_tbs}"
            grep -q 'altSignatureValue' "${pqc_tbs}"
          else
            test -f "${standard_tbs}"
            test ! -e "${pqc_tbs}"
            ! grep -q 'altVerificationKey' "${standard_tbs}"
          fi
